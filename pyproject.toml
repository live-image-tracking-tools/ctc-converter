[project]
name = "ctc-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geff[ctc]",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "traccuracy",
    "typer>=0.27.3",
]

[tool.uv.sources]
geff = { git = "https://github.com/live-image-tracking-tools/geff", subdirectory = "packages/geff", rev = "ctc-ome-zarr" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
